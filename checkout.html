<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout - CurvaFit</title>

    <!-- SEO -->
    <meta name="description" content="Secure checkout for CurvaFit products">
    <meta name="robots" content="noindex, nofollow">

    <!-- Security Policy (UPDATED FOR PAYPAL) -->
    <meta http-equiv="Content-Security-Policy"
    content="default-src 'self' https:;
             script-src 'self' https://js.stripe.com https://www.paypal.com https://www.paypalobjects.com;
             style-src 'self' 'unsafe-inline' https:;
             img-src 'self' https: data:;
             connect-src 'self' https:;
             frame-src https://js.stripe.com https://hooks.stripe.com https://www.paypal.com;">

    <!-- Favicon -->
    <link rel="icon" href="https://cdn.shopify.com/s/files/1/0643/8263/2041/files/favicon.jpg?v=1771465266" type="image/x-icon">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="checkout.css">
</head>

<body>

<header class="checkout-header">
    <div class="header-content">
        <div class="payment-icons">
            <img src="https://cdn.shopify.com/s/files/1/0643/8263/2041/files/Visa.png?v=1771670819" alt="Visa">
            <img src="https://cdn.shopify.com/s/files/1/0643/8263/2041/files/mastercard.png?v=1771670819" alt="Mastercard">
            <img src="https://cdn.shopify.com/s/files/1/0643/8263/2041/files/stripe.webp?v=1771670819" alt="Stripe">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b5/PayPal.svg/320px-PayPal.svg.png" alt="PayPal">
        </div>

        <div class="logo">
            <img src="https://cdn.shopify.com/s/files/1/0643/8263/2041/files/curvalogo.png?v=1771465065" alt="CurvaFit Logo">
            <h1>Secure Checkout</h1>
        </div>
    </div>
</header>

<main class="checkout-main">

    <section class="order-summary">
        <h2>Order Summary</h2>
        <div class="cart-items"></div>
        <div class="summary-totals">
            <p>Subtotal: <span id="subtotal">$0.00</span></p>
            <p>Taxes (10%): <span id="taxes">$0.00</span></p>
            <p>Shipping: <span id="shipping">$0.00</span></p>
            <p class="total">Total: <span id="total">$0.00</span></p>
        </div>
    </section>

    <section class="shipping-info">
        <h2>Shipping Information</h2>
        <form id="shipping-form" autocomplete="on">
            <label for="full-name">Full Name</label>
            <input type="text" id="full-name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" required>

            <label for="country">Country</label>
            <input type="text" id="country" required>

            <label for="city">City</label>
            <input type="text" id="city" required>

            <label for="state">State / Department</label>
            <input type="text" id="state" required>

            <label for="postal-code">Postal Code</label>
            <input type="text" id="postal-code" required>

            <label for="address">Full Address</label>
            <textarea id="address" required></textarea>
        </form>
    </section>

    <section class="payment-method">
        <h2>Payment Method</h2>

        <div class="payment-options">
            <label class="payment-label">
                <input type="radio" name="payment" value="stripe" checked>
                <span>Pay with Credit Card (Stripe)</span>
            </label>

            <label class="payment-label">
                <input type="radio" name="payment" value="paypal">
                <span>Pay with PayPal</span>
            </label>
        </div>

        <!-- PayPal Button Container -->
        <div id="paypal-button-container" style="margin-top:20px;"></div>

        <button type="button" id="pay-button" class="cta">
            Pay Now
        </button>
    </section>

</main>

</body>
</html>
