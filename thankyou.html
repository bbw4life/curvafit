<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - CurvaFit</title>
    <link rel="stylesheet" href="thankyou.css">
</head>
<body>
    <div class="container">
        <h1>Verifying Your Payment...</h1>
        <div id="spinner" class="spinner"></div>
        <div id="message" style="display: none;"></div>
        <div id="buttons" style="display: none;">
            <a href="shop.html" class="button">Continue Shopping</a>
            <a href="orders.html" class="button">View Orders</a>
        </div>
    </div>
   <script>
document.addEventListener('DOMContentLoaded', async () => {
    const spinner = document.getElementById('spinner');
    const messageEl = document.getElementById('message');
    const buttonsEl = document.getElementById('buttons');

    const urlParams = new URLSearchParams(window.location.search);
    const sessionId = urlParams.get('session_id');
    const orderID = urlParams.get('token');
    const forceReset = urlParams.get('reset') === '1';

    // Force reset pour les tests
    if (forceReset) sessionStorage.removeItem("paymentVerified");

    let payload = null;
    if (sessionId) payload = { provider: 'stripe', sessionId };
    else if (orderID) payload = { provider: 'paypal', orderID };

    if (!payload) {
        displayError("No payment information found.");
        spinner.style.display = "none";
        return;
    }

    // Vérification anti-double (améliorée)
    const alreadyVerified = sessionStorage.getItem("paymentVerified");
    if (!forceReset && (alreadyVerified === sessionId || alreadyVerified === orderID)) {
        showSuccess("Payment already verified.");
        spinner.style.display = "none";
        return;
    }

    console.log("🚀 Starting verification...");

    try {
        const functionUrl = `${window.location.origin}/.netlify/functions/verify-payment`;
        const response = await fetch(functionUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        console.log("📡 Response status:", response.status);

        if (response.status === 404) {
            throw new Error("404 - Function verify-payment not found. Redéploie sur Netlify.");
        }

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(data.error || "Verification failed");
        }

        sessionStorage.setItem("paymentVerified", sessionId || orderID);
        localStorage.removeItem("cart");

        const message = data.fulfillmentStatus === "completed"
            ? "✅ Order processed and sent to CJ Dropshipping!"
            : "✅ Order confirmed. Some items pending stock.";

        showSuccess(message);
        console.log("✅ Verification SUCCESS - check CJ now");

    } catch (error) {
        console.error("❌ Verification error:", error);
        displayError(error.message);
    } finally {
        spinner.style.display = "none";
    }
});

function showSuccess(message) {
    document.getElementById('message').innerHTML = `<h1>Thank you for your order!</h1><p>${message}</p>`;
    document.getElementById('message').style.display = 'block';
    document.getElementById('buttons').style.display = 'block';
}
function displayError(message) {
    document.getElementById('message').innerHTML = `<p class="error">${message}</p>`;
    document.getElementById('message').style.display = 'block';
    document.getElementById('buttons').style.display = 'block';
}
</script>
</body>
</html>
