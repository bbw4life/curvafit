<!-- thankyou.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - CurvaFit</title>
    <!-- SEO -->
    <meta name="description" content="Thank you for your order at CurvaFit">
    <meta name="robots" content="noindex, nofollow">
    <!-- Security Policy -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' https:;
         script-src 'self' https://js.stripe.com https://www.paypal.com;
         style-src 'self' 'unsafe-inline' https:;
         img-src 'self' https: data:;
         connect-src 'self' https://restcountries.com https://countriesnow.space https:;
         frame-src https://js.stripe.com https://hooks.stripe.com https://www.paypal.com;">
    <!-- Favicon -->
    <link rel="icon" href="https://cdn.shopify.com/s/files/1/0643/8263/2041/files/favicon.jpg?v=1771465266" type="image/x-icon">
    <!-- Google Fonts for Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Styles -->
    <link rel="stylesheet" href="checkout.css">
    <link rel="stylesheet" href="thankyou.css">
</head>
<body>
<header class="checkout-header">
    <div class="header-content">
        <!-- Logo Center -->
        <div class="logo">
            <a href="index.html"><img src="https://cdn.shopify.com/s/files/1/0643/8263/2041/files/curvalogo.png?v=1771465065" alt="CurvaFit Logo"></a>
            <h1>Order Confirmation</h1>
        </div>
    </div>
</header>
<section id="wave-section">
    <svg width="0" height="0">
        <defs>
        <linearGradient id="wave-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" />
            <stop offset="100%" />
        </linearGradient>
        </defs>
    </svg>
    <div class="wave-container">
        <svg class="wave" viewBox="0 0 1000 100" preserveAspectRatio="none">
        <path d="M0,50 L100,50 L150,30 L200,70 L250,50 L300,30 L350,70 L400,50 L450,30 L500,70 L550,50 L600,30 L650,70 L700,50 L750,30 L800,70 L850,50 L900,30 L950,70 L1000,50 L1000,100 L0,100 Z" /> <!-- Fine Zigzag -->
        </svg>
    </div>
</section>
    <div class="container">
        <h1>Confirming Your Order...</h1>
        <div id="spinner" class="spinner"></div>
        <div id="message" style="display: none;"></div>
        <div id="buttons" style="display: none;">
            <a href="shop.html" class="button">Continue Shopping</a>
            <a href="account.html" class="button">View Orders</a>
        </div>
    </div>
<script src="thankyou.js"></script>
</body>
</html>
