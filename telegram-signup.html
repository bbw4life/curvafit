<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/maintenance-gate.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Curvafit on Telegram</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bbw-gold: #D83F8D;
    --col-dark: #30203A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, var(--col-dark));
    padding: 20px 18px 40px;
  }
  .logo {
    text-align: center;
    margin: 0 auto 10px;
  }
  .logo img {
    display: block;
    width: min(168px, 52vw);
    max-height: 76px;
    margin: 0 auto;
    object-fit: contain;
  }
  .subtitle {
    text-align: center;
    font-size: 13.5px;
    color: var(--tg-theme-hint-color, #7a7a7a);
    margin-bottom: 24px;
    line-height: 1.4;
  }
  .page-title {
    margin: 0 0 6px;
    text-align: center;
    font-size: 19px;
    line-height: 1.25;
    font-weight: 750;
    color: var(--tg-theme-text-color, var(--col-dark));
  }
  form { display: flex; flex-direction: column; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  label { font-size: 12.5px; font-weight: 600; color: var(--tg-theme-text-color, var(--col-dark)); }
  input {
    width: 100%;
    padding: 12px 13px;
    border-radius: 10px;
    border: 1px solid var(--tg-theme-hint-color, #d9d3ca);
    background: var(--tg-theme-secondary-bg-color, #f7f3ee);
    color: var(--tg-theme-text-color, var(--col-dark));
    font-size: 15px;
    outline: none;
  }
  input:focus { border-color: var(--bbw-gold); }
  .row-2 { display: flex; gap: 10px; }
  .row-2 .field { flex: 1 1 0; }
  button[type="submit"] {
    margin-top: 10px;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: var(--bbw-gold);
    color: #fff;
    font-size: 15.5px;
    font-weight: 700;
    cursor: pointer;
  }
  button[type="submit"]:disabled { opacity: 0.6; }
  .msg { text-align: center; font-size: 13.5px; margin-top: 14px; min-height: 18px; }
  .msg.error { color: #c0392b; }
  .msg.success { color: #2e7d32; }
  .hint { font-size: 11.5px; color: var(--tg-theme-hint-color, #999); margin-top: -2px; }
</style>
  <meta name="description" content="Create your Curvafit account and connect it to Telegram for order updates and helpful news from Curvafit.">
  <meta name="keywords" content="Curvafit account, Curvafit Telegram, create Curvafit account, Curvafit order updates">
  <link rel="canonical" href="https://curvafit.com/telegram-signup.html">
  <meta property="og:title" content="Join Curvafit on Telegram">
  <meta property="og:description" content="Create your Curvafit account and receive order updates and helpful news in Telegram.">
  <meta property="og:url" content="https://curvafit.com/telegram-signup.html">
  <meta name="robots" content="noindex, nofollow">
  <script src="/src/components/theme-color.js" defer></script>
</head>
<body>

  <div class="logo"><img src="/public/Logo-Curvafit.png" alt="Curvafit"></div>
  <h1 class="page-title">Create your Curvafit account</h1>
  <div class="subtitle">
    Link your account to Telegram for order confirmations, delivery updates, and helpful Curvafit news and offers.
  </div>

  <form id="tgSignupForm">
    <div class="row-2">
      <div class="field">
        <label for="firstName">First name</label>
        <input type="text" id="firstName" required autocomplete="given-name">
      </div>
      <div class="field">
        <label for="lastName">Last name</label>
        <input type="text" id="lastName" required autocomplete="family-name">
      </div>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email">
    </div>

    <div class="field">
      <label for="phone">Phone <span class="hint">(optional)</span></label>
      <input type="tel" id="phone" autocomplete="tel">
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" required minlength="6" autocomplete="new-password">
    </div>

    <div class="field">
      <label for="confirmPassword">Confirm password</label>
      <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password">
    </div>

    <button type="submit" id="submitBtn">Create my Curvafit account</button>
    <div class="msg" id="formMsg"></div>
  </form>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }

  function getChatId() {
    var params = new URLSearchParams(window.location.search);
    var fromQuery = params.get('chat_id');
    if (fromQuery) return fromQuery;
    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
      return String(tg.initDataUnsafe.user.id);
    }
    return '';
  }

  var chatId = getChatId();
  var form = document.getElementById('tgSignupForm');
  var msgEl = document.getElementById('formMsg');
  var submitBtn = document.getElementById('submitBtn');

  function showMsg(text, type) {
    msgEl.textContent = text;
    msgEl.className = 'msg' + (type ? ' ' + type : '');
  }

  if (!chatId) {
    showMsg('Telegram session not found. Please reopen this form from the Curvafit bot.', 'error');
    submitBtn.disabled = true;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    var firstName = document.getElementById('firstName').value.trim();
    var lastName = document.getElementById('lastName').value.trim();
    var email = document.getElementById('email').value.trim();
    var phone = document.getElementById('phone').value.trim();
    var password = document.getElementById('password').value;
    var confirmPassword = document.getElementById('confirmPassword').value;

    if (password.length < 6) {
      showMsg('Password must be at least 6 characters.', 'error');
      return;
    }
    if (password !== confirmPassword) {
      showMsg('Passwords do not match.', 'error');
      return;
    }

    submitBtn.disabled = true;
    showMsg('Creating your Curvafit account…', '');

    fetch('/save-account', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'signup_via_telegram',
        firstName: firstName,
        lastName: lastName,
        email: email,
        phone: phone,
        password: password,
        telegramChatId: chatId
      })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data && data.success) {
          showMsg('Welcome to Curvafit! Your account is ready and linked to Telegram. You can close this window; your confirmation is waiting in the chat.', 'success');
          form.style.display = 'none';
          if (tg) { setTimeout(function () { tg.close(); }, 2500); }
        } else {
          showMsg((data && data.error) || 'Something went wrong. Please try again.', 'error');
          submitBtn.disabled = false;
        }
      })
      .catch(function () {
        showMsg('Network error — please try again.', 'error');
        submitBtn.disabled = false;
      });
  });
})();
</script>

</body>
</html>
